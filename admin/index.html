<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel IRON PULSE</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(../fonts/BarlowCondensed-700-latin.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(../fonts/BarlowCondensed-800-latin.woff2) format('woff2')}
@font-face{font-family:'Barlow Semi Condensed';font-weight:400;font-display:swap;src:url(../fonts/BarlowSemiCondensed-400-latin.woff2) format('woff2')}
@font-face{font-family:'Barlow Semi Condensed';font-weight:400;font-display:swap;src:url(../fonts/BarlowSemiCondensed-400-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Barlow Semi Condensed';font-weight:600;font-display:swap;src:url(../fonts/BarlowSemiCondensed-600-latin.woff2) format('woff2')}
:root{
  --ink:#0c0c0c; --ink-2:#141414; --steel:#1b1b1b; --steel-2:#242424; --line:#2e2e2e;
  --yellow:#f6c21e; --paper:#f2f2f0; --muted:#a8a8a4; --muted-2:#7a7a74;
  --ok:#5fd38d; --warn:#ff9f43; --bad:#ff6b6b;
  --display:'Barlow Condensed',system-ui,sans-serif; --text:'Barlow Semi Condensed',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font:400 15px/1.45 var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* ingreso */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:26px}
.card img{height:34px;margin-bottom:18px}
.card h1{margin:0 0 4px;font:800 30px/1 var(--display);text-transform:uppercase}
.card p{margin:0 0 18px;color:var(--muted)}
label.f{display:block;margin:0 0 12px;font-size:13px;color:var(--muted)}
label.f input{display:block;width:100%;margin-top:4px}
input,select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--yellow);outline:none}
textarea{width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--steel);font:700 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--yellow);color:var(--yellow)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn.pri:hover{background:#ffd23a;color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.del{color:var(--muted);padding:6px 8px;border-color:transparent;background:none}
.btn.del:hover{color:var(--bad);border-color:var(--bad)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
.msg{margin-top:12px;font-size:14px;color:var(--muted)}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}

/* app */
.top{position:sticky;top:0;z-index:20;background:rgba(12,12,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap}
.top img{height:24px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs button{padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--muted);font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tabs button:hover{color:var(--paper)}
.tabs button[aria-selected="true"]{background:var(--steel-2);color:var(--yellow)}
.me{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
main{padding:22px 0 80px}
h2{margin:0 0 4px;font:800 32px/1 var(--display);text-transform:uppercase}
h3{margin:22px 0 8px;font:700 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.sub{margin:0 0 18px;color:var(--muted);max-width:80ch}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:700 12px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input,td select{width:100%}
td select{min-width:118px}
td input.n{text-align:right;width:120px}
td input.n.sm{width:80px}
tr.grupo td{background:var(--steel);font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
.big{font:800 20px/1 var(--display)}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.y{border-color:var(--yellow);color:var(--yellow)}
.badge.bad{border-color:var(--bad);color:var(--bad)}
.impacto{font-size:13px;color:var(--warn);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pills button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--steel);font:700 14px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.pills button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.totales{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.totales div small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.totales div b{font:800 22px/1.1 var(--display)}
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto{position:relative;width:96px}
.foto img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--steel)}
.foto .acc{display:flex;justify-content:space-between;margin-top:3px}
.foto .acc button{background:none;border:0;color:var(--muted);padding:2px 4px}
.foto .acc button:hover{color:var(--yellow)}
.foto .acc button.x:hover{color:var(--bad)}
.add-foto{width:96px;height:96px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--muted);display:grid;place-items:center;text-align:center;font-size:12px}
.add-foto:hover{border-color:var(--yellow);color:var(--yellow)}
.costo-pieza td{background:#101010}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:999px;background:var(--steel-2);border:1px solid var(--line);font-size:14px;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:16px}
.modal .card{max-width:860px;max-height:86vh;overflow:auto}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.lib button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--steel)}
.lib button:hover{border-color:var(--yellow)}
.lib img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.lib span{display:block;font-size:11px;color:var(--muted);padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist td{font-size:14px}
.hist .cambio{color:var(--muted)}
.hist .cambio b{color:var(--paper);font-weight:600}
@media (max-width:700px){h2{font-size:26px}.me span{display:none}}
</style>
</head>

<!-- ============ Ingreso ============ -->
<section class="login" id="vLogin" hidden>
  <form class="card" id="fLogin">
    <img src="../img/logo-ironpulse.png" alt="IRON PULSE">
    <h1 id="lTitulo">Panel</h1>
    <p id="lSub">Costos, precios y catálogo.</p>
    <label class="f" id="lNombreWrap" hidden>Nombre<input id="lNombre" autocomplete="name"></label>
    <label class="f" id="lMailWrap">Mail<input id="lMail" type="email" autocomplete="email" required></label>
    <label class="f" id="lPassWrap">Contraseña<input id="lPass" type="password" autocomplete="current-password" minlength="8" required></label>
    <button class="btn pri" style="width:100%" id="lBtn">Entrar</button>
    <div class="row" style="justify-content:space-between;margin-top:14px">
      <button type="button" class="link" id="lCrear">Crear cuenta</button>
      <button type="button" class="link" id="lOlvide">Olvidé mi contraseña</button>
    </div>
    <div class="msg" id="lMsg" role="status"></div>
  </form>
</section>

<section class="login" id="vPend" hidden>
  <div class="card">
    <img src="../img/logo-ironpulse.png" alt="IRON PULSE">
    <h1>Cuenta pendiente</h1>
    <p>Tu cuenta (<b id="pMail"></b>) está creada. Falta que alguien del equipo la apruebe desde el panel. Cuando esté, recargá esta página.</p>
    <button class="btn" id="pSalir"><svg class="ico"><use href="#i-out"/></svg>Salir</button>
  </div>
</section>

<section class="login" id="vSinConfig" hidden>
  <div class="card"><h1>Falta conectar la base</h1><p>Completá <code>supabase-config.js</code> con la URL y la clave del proyecto.</p></div>
</section>

<!-- ============ App ============ -->
<div id="vApp" hidden>
  <header class="top">
    <div class="wrap">
      <img src="../img/logo-ironpulse.png" alt="IRON PULSE">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-t="precios">Precios</button>
        <button role="tab" data-t="materiales">Materiales</button>
        <button role="tab" data-t="productos">Productos</button>
        <button role="tab" data-t="pagina">Página</button>
        <button role="tab" data-t="usuarios">Usuarios</button>
        <button role="tab" data-t="historial">Historial</button>
      </nav>
      <div class="me"><a class="btn sm" href="../" target="_blank" rel="noopener"><svg class="ico"><use href="#i-ext"/></svg>Ver catálogo</a><span id="meMail"></span><button class="btn sm" id="salir" aria-label="Salir"><svg class="ico"><use href="#i-out"/></svg></button></div>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileUp" accept="image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../supabase-config.js"></script>
<script>
/* =====================================================================
   Panel IRON PULSE. Todo lo que se ve acá lo protege la base (RLS):
   una cuenta que no está aprobada recibe tablas vacías.
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0});
const money = v => v == null || isNaN(v) ? '—' : fmt.format(v);
const pct = v => v == null || !isFinite(v) ? '—' : (v * 100).toLocaleString('es-AR', {maximumFractionDigits: 1}) + '%';
// acepta 1.477.750 · 1477750 · 0,33 · 0.33 · 14,9 (punto de miles solo si hay grupos de 3)
const num = s => {
  if (s === '' || s == null) return null;
  let t = String(s).trim().replace(/[\s$]/g, '');
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const v = +t; return isNaN(v) ? null : v;
};
const numIn = v => v == null || v === '' ? '' : (+v).toLocaleString('es-AR', {maximumFractionDigits: 4});
const hace = d => { if (!d) return null; const dias = Math.floor((Date.now() - new Date(d)) / 864e5); return dias <= 0 ? 'hoy' : dias === 1 ? 'ayer' : `hace ${dias} días`; };

function toast(t, bad){ const el = $('#toast'); el.textContent = t; el.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => el.className = 'toast', 2200); }

const CFG = window.IP_SUPABASE || {};
if (!CFG.url || !CFG.key){ $('#vSinConfig').hidden = false; throw new Error('sin config'); }
const sb = supabase.createClient(CFG.url, CFG.key);

/* ---------- fotos: nombres del repo o URL del bucket ---------- */
const big = f => /^https?:/.test(f) ? f : `../img/${f.includes('.') ? f : f + '.webp'}`;
const th  = f => /^https?:/.test(f) ? f.replace('/fotos/', '/fotos/th/') : `../img/${f.includes('.') ? f : 'th/' + f + '.webp'}`;

/* =====================================================================
   Ingreso
   ===================================================================== */
let modo = 'entrar';
function modoLogin(m){
  modo = m;
  $('#lNombreWrap').hidden = m !== 'crear';
  $('#lPassWrap').hidden = m === 'olvide';
  $('#lPass').required = m !== 'olvide';
  $('#lPass').autocomplete = m === 'crear' || m === 'nueva' ? 'new-password' : 'current-password';
  $('#lMailWrap').hidden = m === 'nueva';
  $('#lMail').required = m !== 'nueva';
  $('#lTitulo').textContent = {entrar:'Panel', crear:'Crear cuenta', olvide:'Recuperar', nueva:'Nueva contraseña'}[m];
  $('#lSub').textContent = {entrar:'Costos, precios y catálogo.', crear:'Queda pendiente hasta que alguien del equipo la apruebe.',
                            olvide:'Te mandamos un mail con un link.', nueva:'Elegí una contraseña nueva (mínimo 8).'}[m];
  $('#lBtn').textContent = {entrar:'Entrar', crear:'Crear cuenta', olvide:'Mandar link', nueva:'Guardar'}[m];
  $('#lCrear').textContent = m === 'entrar' ? 'Crear cuenta' : 'Ya tengo cuenta';
  $('#lMsg').textContent = '';
}
$('#lCrear').onclick = () => modoLogin(modo === 'entrar' ? 'crear' : 'entrar');
$('#lOlvide').onclick = () => modoLogin('olvide');
$('#fLogin').onsubmit = async e => {
  e.preventDefault();
  const mail = $('#lMail').value.trim(), pass = $('#lPass').value, msg = $('#lMsg');
  msg.className = 'msg'; msg.textContent = '…';
  let r;
  if (modo === 'entrar') r = await sb.auth.signInWithPassword({email: mail, password: pass});
  else if (modo === 'crear') r = await sb.auth.signUp({email: mail, password: pass,
            options: {data: {nombre: $('#lNombre').value.trim()}, emailRedirectTo: location.href.split('#')[0]}});
  else if (modo === 'olvide') r = await sb.auth.resetPasswordForEmail(mail, {redirectTo: location.href.split('#')[0]});
  else r = await sb.auth.updateUser({password: pass});
  if (r.error){ msg.className = 'msg bad'; msg.textContent = traducir(r.error.message); return; }
  if (modo === 'entrar'){ msg.textContent = ''; arrancar(); }
  else if (modo === 'crear'){ msg.className = 'msg ok'; msg.textContent = r.data.session ? 'Cuenta creada.' : 'Listo. Revisá tu mail para confirmar la cuenta.'; if (r.data.session) arrancar(); }
  else if (modo === 'olvide'){ msg.className = 'msg ok'; msg.textContent = 'Si el mail existe, te llegó un link.'; }
  else if (modo === 'nueva'){ modoLogin('entrar'); toast('Contraseña cambiada'); arrancar(); }
};
function traducir(m){
  if (/invalid login/i.test(m)) return 'Mail o contraseña incorrectos.';
  if (/email not confirmed/i.test(m)) return 'Falta confirmar el mail: revisá tu bandeja.';
  if (/already registered/i.test(m)) return 'Ese mail ya tiene cuenta.';
  if (/password/i.test(m) && /6|8|characters/i.test(m)) return 'La contraseña es muy corta.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Probá en unos minutos.';
  return m;
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY'){ mostrar('login'); modoLogin('nueva'); } });
$('#salir').onclick = $('#pSalir').onclick = async () => { await sb.auth.signOut(); location.reload(); };

function mostrar(v){ ['vLogin','vPend','vApp'].forEach(id => $('#' + id).hidden = id !== 'v' + v[0].toUpperCase() + v.slice(1)); }

/* =====================================================================
   Datos y motor de costos (espejo de la función costo() de la base)
   ===================================================================== */
const D = {};
let YO = null;
async function cargar(){
  const q = (t, o) => sb.from(t).select('*').order(o || 'id');
  const r = await Promise.all([q('materiales', 'nombre'), q('receta'), q('costos_producto', 'orden'), q('precios'), q('ajustes', 'clave'),
                               q('productos', 'orden'), q('piezas', 'orden'), q('config', 'clave'), q('admins', 'creado_en')]);
  const err = r.find(x => x.error); if (err) throw err.error;
  [D.materiales, D.receta, D.costos, D.precios, D.ajustes, D.productos, D.piezas, D.config, D.admins] = r.map(x => x.data);
}
const tarifa = () => +(D.ajustes.find(a => a.clave === 'tarifa_hora')?.valor || 0);
const mat = id => D.materiales.find(m => m.id === id);
const esDe = (x, ref) => ref.pieza_id ? x.pieza_id === ref.pieza_id : x.producto_id === ref.producto_id && !x.pieza_id;
function subLinea(l, matOverride){
  const m = matOverride?.id === l.material_id ? matOverride : mat(l.material_id); if (!m) return 0;
  return m.tipo === 'chapa' ? (m.largo ? m.precio * l.cantidad / m.largo : 0) : m.precio * l.cantidad;
}
function subCosto(c, bases){
  return {horas: c.valor * tarifa(), pct_corte_chapa: c.valor / 100 * bases.chapa, pct_corte_estructural: c.valor / 100 * bases.estructural,
          pct_plegado: c.valor / 100 * bases.plegado, fijo: +c.valor}[c.tipo] || 0;
}
function costoDe(ref, matOverride){
  const lineas = D.receta.filter(l => esDe(l, ref));
  const b = {total: 0, chapa: 0, estructural: 0, plegado: 0};
  for (const l of lineas){
    const m = matOverride?.id === l.material_id ? matOverride : mat(l.material_id); const s = subLinea(l, matOverride);
    b.total += s; if (m?.corte === 'chapa') b.chapa += s; if (m?.corte === 'estructural') b.estructural += s; if (m?.plegado) b.plegado += s;
  }
  const extras = D.costos.filter(c => esDe(c, ref)).reduce((n, c) => n + subCosto(c, b), 0);
  return {costo: Math.round((b.total + extras) * 100) / 100, bases: b};
}
const precioDe = ref => D.precios.find(p => ref.pieza_id ? p.pieza_id === ref.pieza_id : p.producto_id === ref.producto_id);
function sugerido(costo, p){ const g = p?.ganancia ?? .8, r = p?.redondeo || 1000; return costo > 0 ? Math.round(costo * (1 + g) / r) * r : null; }
function fila(ref, matOverride){
  const {costo} = costoDe(ref, matOverride), p = precioDe(ref), sug = sugerido(costo, p);
  const pub = p?.precio_manual ?? sug;
  return {costo, p, sug, pub, margen: costo > 0 && pub ? pub / costo - 1 : null};
}

async function guardar(tabla, id, cambios, campoId = 'id'){
  const {error} = await sb.from(tabla).update(cambios).eq(campoId, id);
  if (error){ toast('No se guardó: ' + error.message, true); return false; }
  const arr = {costos_producto: D.costos}[tabla] || D[tabla];
  const it = arr?.find(x => x[campoId] === id); if (it) Object.assign(it, cambios);

}
async function insertar(tabla, fila_){
  const {data, error} = await sb.from(tabla).insert(fila_).select().single();
  if (error){ toast('No se guardó: ' + error.message, true); return null; }
  ({costos_producto: D.costos}[tabla] || D[tabla]).push(data); toast('Agregado'); return data;
}
async function borrar(tabla, id){
  const {error} = await sb.from(tabla).delete().eq('id', id);
  if (error){ toast('No se borró: ' + error.message, true); return false; }
  const arr = {costos_producto: D.costos}[tabla] || D[tabla]; const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1);
  toast('Borrado'); return true;
}

      </tbody></table></div>
    ${D.materiales.some(m => !m.actualizado_en) ? `<p class="sub"><span class="badge warn">ojo</span> Hay materiales con el precio viejo del Excel: los costos y márgenes de arriba están calculados con esos precios. Actualizalos en <a href="#materiales" data-ir="materiales">Materiales</a>.</p>` : ''}`;

    const id = nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if (D.productos.find(p => p.id === id)) return toast('Ya existe uno con ese nombre', true);
    if (await insertar('productos', {id, nombre, categoria: 'otro', orden: 99, visible: false})){ await insertar('precios', {producto_id: id, ganancia: .8, redondeo: 1000}); PROD = id; vProductos(); toast('Creado oculto: completalo y tildá "Visible"'); }
    return;
  }
  if (a === 'addMat'){ const ref = refCosto(b); if (!D.materiales.length) return toast('Cargá un material primero', true);
    if (await insertar('receta', {...ref, material_id: D.materiales[0].id, cantidad: 1})) vProductos(); return; }
  if (a === 'addCosto'){ const ref = refCosto(b); if (await insertar('costos_producto', {...ref, concepto: 'Nuevo costo', tipo: 'fijo', valor: 0, orden: 99})) vProductos(); return; }
  if (a === 'addPieza'){ if (await insertar('piezas', {producto_id: PROD, tipo: 'incluido', cantidad: 1, pieza: 'Pieza nueva', orden: 99})) vProductos(); return; }
  if (a === 'costoPieza'){ const id = +b.closest('tr').dataset.id; ABIERTA = ABIERTA === id ? null : id;
    if (ABIERTA && !precioDe({pieza_id: id})) await insertar('precios', {pieza_id: id, ganancia: .8, redondeo: 1000}); vProductos(); return; }
  if (a === 'del'){ const tr = b.closest('[data-t]'); const t = tr.dataset.t;
    if (!confirm('¿Borrar?')) return; if (await borrar(t, +tr.dataset.id)) vProductos(); return; }
  if (['izq','der','quitar','addFoto'].includes(a)){
    const box = b.closest('[data-fotos]'); const [tipo, rid] = box.dataset.fotos.split(':');
    const tabla = tipo === 'p' ? 'productos' : 'piezas', id = tipo === 'p' ? rid : +rid;
    const obj = (tipo === 'p' ? D.productos : D.piezas).find(x => x.id === id); const fotos = [...(obj.fotos || [])];
    if (a === 'addFoto'){ elegirFoto(async f => { fotos.push(f); if (await guardar(tabla, id, {fotos})) vProductos(); }); return; }
    const i = +b.closest('.foto').dataset.i;
    if (a === 'quitar') fotos.splice(i, 1);
    if (a === 'izq' && i > 0) [fotos[i - 1], fotos[i]] = [fotos[i], fotos[i - 1]];
    if (a === 'der' && i < fotos.length - 1) [fotos[i + 1], fotos[i]] = [fotos[i], fotos[i + 1]];
    if (await guardar(tabla, id, {fotos})) vProductos();
  }
}

/* ---------- biblioteca de fotos + subida ---------- */
let LIBRERIA = null;
async function libreria(){
  if (!LIBRERIA){ try { LIBRERIA = await (await fetch('../img/lista.json', {cache: 'no-store'})).json(); } catch { LIBRERIA = []; } }
  const {data} = await sb.storage.from('fotos').list('', {limit: 500, sortBy: {column: 'created_at', order: 'desc'}});
  const subidas = (data || []).filter(o => o.name.endsWith('.webp')).map(o => sb.storage.from('fotos').getPublicUrl(o.name).data.publicUrl);
  return [...subidas, ...LIBRERIA];
}
function elegirFoto(cb){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h1 style="font-size:24px;margin:0">Elegí una foto</h1><button class="btn sm" data-x>Cerrar</button></div>
    <p style="margin:8px 0 0">Solo fotos reales o renders de la pieza. Se achican solas antes de subir.</p>
    <div class="row" style="margin-top:12px"><button class="btn pri sm" data-up>Subir desde la compu o el celu</button><span class="msg" data-st style="margin:0"></span></div>
    <div class="lib" data-lib>Cargando…</div></div>`;
  document.body.append(m);
  const cerrar = () => m.remove();
  m.onclick = e => {
    if (e.target === m || e.target.closest('[data-x]')) cerrar();
    const f = e.target.closest('[data-f]'); if (f){ cerrar(); cb(f.dataset.f); }
    if (e.target.closest('[data-up]')){ const fi = $('#fileUp'); fi.value = ''; fi.onchange = async () => {
      for (const file of fi.files){ $('[data-st]', m).textContent = 'Subiendo ' + file.name + '…'; const url = await subirFoto(file); if (url){ cerrar(); cb(url); return; } }
      $('[data-st]', m).textContent = ''; }; fi.click(); }
  };
  libreria().then(fs => { $('[data-lib]', m).innerHTML = fs.map(f => `<button data-f="${esc(f)}"><img src="${esc(th(f))}" alt="" loading="lazy"><span>${esc(/^https?:/.test(f) ? 'subida · ' + f.split('/').pop() : f)}</span></button>`).join(''); });
}
async function achicar(file, lado, calidad){
  const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
  const k = Math.min(1, lado / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/webp', calidad));
}
async function subirFoto(file){
  try {
    const base = file.name.replace(/\.[^.]+$/, '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '-' + Date.now().toString(36) + '.webp';
    const [grande, chica] = await Promise.all([achicar(file, 1600, .82), achicar(file, 640, .78)]);
    let r = await sb.storage.from('fotos').upload(base, grande, {contentType: 'image/webp'}); if (r.error) throw r.error;
    r = await sb.storage.from('fotos').upload('th/' + base, chica, {contentType: 'image/webp'}); if (r.error) throw r.error;
    toast('Foto subida'); return sb.storage.from('fotos').getPublicUrl(base).data.publicUrl;
  } catch (e){ toast('No se subió: ' + (e.message || e), true); return null; }
}

/* ---------- Página (config) ---------- */
function vPagina(){
  const c = k => D.config.find(x => x.clave === k)?.valor || '';
  const campos = [['whatsapp', 'WhatsApp (con 54, sin + ni espacios)'], ['instagram', 'Usuario de Instagram'], ['titulo', 'Título'], ['subtitulo', 'Subtítulo']];
  $('#main').innerHTML = `<h2>Página</h2><p class="sub">Datos generales del catálogo.</p>
    <div class="panel grid2">${campos.map(([k, l]) => `<label class="f">${l}<input data-k="${k}" value="${esc(c(k))}"></label>`).join('')}</div>`;
  $('#main').onchange = async e => { const k = e.target.dataset.k; if (!k) return; const v = e.target.value.trim();
    if (k === 'whatsapp' && !/^\d{10,15}$/.test(v)) return toast('El WhatsApp tiene que ser solo números, con 54 adelante', true);
    if (D.config.find(x => x.clave === k)) await guardar('config', k, {valor: v}, 'clave');
    else { const {error} = await sb.from('config').insert({clave: k, valor: v}); if (!error){ D.config.push({clave: k, valor: v}); toast('Guardado'); } } };
}

/* ---------- Historial ---------- */
async function vHistorial(){
  $('#main').innerHTML = '<h2>Historial</h2><p class="sub">Últimos 150 cambios.</p><div class="panel">Cargando…</div>';
  const {data, error} = await sb.from('historial').select('*').order('cuando', {ascending: false}).limit(150);
  if (error) return toast(error.message, true);
  const NOMBRES = {productos: 'Producto', piezas: 'Pieza', config: 'Página', materiales: 'Material', receta: 'Receta', costos_producto: 'Costo', precios: 'Precio', ajustes: 'Ajuste', admins: 'Usuario'};
  const resumen = h => {
    const o = h.despues || h.antes || {}; const quien = o.nombre || o.pieza || o.concepto || o.clave || o.email || o.producto_id || '';
    if (h.accion !== 'UPDATE') return `${h.accion === 'INSERT' ? 'Alta' : 'Baja'} <b>${esc(quien)}</b>`;
    const cambios = Object.keys(h.despues).filter(k => JSON.stringify(h.antes[k]) !== JSON.stringify(h.despues[k]) && !['actualizado_en','actualizado_por'].includes(k));
    return `<b>${esc(quien)}</b>: ` + cambios.map(k => `${esc(k)} <b>${esc(JSON.stringify(h.antes[k]))}</b> → <b>${esc(JSON.stringify(h.despues[k]))}</b>`).join(' · ');
  };
  $('#main').innerHTML = `<h2>Historial</h2><p class="sub">Últimos 150 cambios.</p>
    <div class="panel scroll hist"><table><thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Cambio</th></tr></thead>
    <tbody>${data.map(h => `<tr><td style="white-space:nowrap">${new Date(h.cuando).toLocaleString('es-AR', {dateStyle: 'short', timeStyle: 'short'})}</td><td>${esc(h.quien)}</td><td>${NOMBRES[h.tabla] || esc(h.tabla)}</td><td class="cambio">${resumen(h)}</td></tr>`).join('') || '<tr><td colspan="4">Sin cambios todavía.</td></tr>'}</tbody></table></div>`;
}

async function arrancar(){
  const {data: {session}} = await sb.auth.getSession();
  if (!session){ mostrar('login'); modoLogin('entrar'); return; }
  const {data: yo} = await sb.from('admins').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!yo || yo.estado !== 'activo'){ $('#pMail').textContent = session.user.email; mostrar('pend'); return; }
  YO = yo; $('#meMail').textContent = session.user.email;
  try { await cargar(); } catch (e){ toast('Error al cargar: ' + e.message, true); return; }
  mostrar('app');
  const t = location.hash.slice(1); ir(['precios','materiales','productos','pagina','usuarios','historial'].includes(t) ? t : 'precios');
}
if (!/type=recovery/.test(location.hash)) arrancar();
